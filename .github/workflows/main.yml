name: Build Kivy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install Cython and Buildozer
      run: |
        pip install cython buildozer

    - name: Install Android SDK build-tools (fix aidl missing)
      run: |
        SDK_PATH="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p $SDK_PATH

        # Download command line tools if not already present
        if [ ! -f $SDK_PATH/cmdline-tools/latest/bin/sdkmanager ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          mkdir -p $SDK_PATH/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d $SDK_PATH/cmdline-tools
          mv $SDK_PATH/cmdline-tools/cmdline-tools $SDK_PATH/cmdline-tools/latest
        fi

        # Accept licenses (ignore broken pipe or already accepted)
        yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # Install build-tools 33.0.0 (contains aidl)
        $SDK_PATH/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0"

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: stock_simulator_apk
        path: bin/*.apk
